<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>串夾｜Threads 收藏分類整理</title>
  <meta name="description" content="把 Threads 貼文網址存起來，用分類、標籤和筆記整理，日後快速找回。資料只存在你的瀏覽器。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101016" media="(prefers-color-scheme: dark)">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="串夾｜Threads 收藏分類整理">
  <meta property="og:description" content="把 Threads 貼文網址存起來，用分類、標籤和筆記整理，日後快速找回。">
  <meta property="og:locale" content="zh_TW">
  <!-- 【待補：og:image 需填部署後的絕對網址，例如 https://username.github.io/倉庫名稱/og.png】 -->

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- 在 CSS 載入前套用已存的主題，避免閃一下錯的顏色 -->
  <script>
    (() => {
      let t = 'system';
      try { t = localStorage.getItem('threads-shelf:theme') || 'system'; } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <!-- 用 defer 而非 type="module"：直接雙擊開檔（file://）時 module 會被瀏覽器擋下 -->
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#list">跳到收藏清單</a>

  <header class="site-header">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg>
      <div>
        <h1 class="brand__name">串夾</h1>
        <p class="brand__tag">替 Threads 收藏加上分類</p>
      </div>
    </div>
    <div class="header-tools">
      <p class="stat" aria-live="polite"><span data-total>0</span> 則收藏</p>

      <!-- 資料備份 -->
      <div class="backup-picker">
        <button type="button" class="theme-btn" aria-expanded="false" aria-controls="backup-panel" data-backup-btn aria-label="資料備份：匯出或匯入">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-stroke"><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          <span class="theme-btn__label">備份</span>
        </button>
        <div class="theme-panel backup-panel" id="backup-panel" hidden>
          <p class="menu-label">資料備份</p>
          <button type="button" class="menu-item" data-export>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
            <span>匯出備份<small>下載成 JSON 檔</small></span>
          </button>
          <button type="button" class="menu-item" data-import>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
            <span>匯入備份<small>與現有資料合併，不會覆蓋</small></span>
          </button>
          <p class="menu-note" data-last-export>還沒匯出過備份</p>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>

      <!-- 主題選擇 -->
      <div class="theme-picker">
        <button type="button" class="theme-btn" aria-expanded="false" aria-controls="theme-panel" data-theme-btn>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.6 17 3 12 3Z"/><circle cx="7.5" cy="11" r="1.3"/><circle cx="10.5" cy="7" r="1.3"/><circle cx="15" cy="7.5" r="1.3"/></svg>
          <span class="theme-btn__label" data-theme-label>主題</span>
        </button>
        <div class="theme-panel" id="theme-panel" hidden>
          <fieldset>
            <legend>選擇主題</legend>
            <label class="theme-opt"><input type="radio" name="theme" value="system"><span class="swatch swatch--system" aria-hidden="true"></span>跟隨系統</label>
            <label class="theme-opt"><input type="radio" name="theme" value="paper"><span class="swatch" style="--s1:#f6f3ee;--s2:#5442d6" aria-hidden="true"></span>米白</label>
            <label class="theme-opt"><input type="radio" name="theme" value="night"><span class="swatch" style="--s1:#101016;--s2:#a99dff" aria-hidden="true"></span>夜幕</label>
            <label class="theme-opt"><input type="radio" name="theme" value="matcha"><span class="swatch" style="--s1:#eef2ea;--s2:#3b7538" aria-hidden="true"></span>抹茶</label>
            <label class="theme-opt"><input type="radio" name="theme" value="ocean"><span class="swatch" style="--s1:#edf2f6;--s2:#1f5fa8" aria-hidden="true"></span>海霧</label>
            <label class="theme-opt"><input type="radio" name="theme" value="aurora"><span class="swatch" style="--s1:#0b1416;--s2:#5ee0b8" aria-hidden="true"></span>極光</label>
          </fieldset>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- 左欄：新增與分類 -->
    <aside class="sidebar">
      <section class="panel" aria-labelledby="add-title">
        <h2 id="add-title" class="panel__title">新增收藏</h2>
        <form class="add-form" novalidate>
          <div class="field">
            <label for="f-url">Threads 網址</label>
            <div class="input-row">
              <input id="f-url" name="url" type="url" inputmode="url" autocomplete="off" required
                     placeholder="https://www.threads.com/@…/post/…" aria-describedby="f-url-msg">
              <button type="button" class="btn btn--ghost" data-paste>貼上</button>
            </div>
            <p id="f-url-msg" class="field__msg" role="status"></p>
          </div>

          <div class="field">
            <label for="f-note">筆記 <span class="optional">選填</span></label>
            <textarea id="f-note" name="note" rows="2" placeholder="這篇在講什麼、為什麼想留著"></textarea>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="f-cat">分類</label>
              <select id="f-cat" name="category"></select>
            </div>
            <div class="field">
              <label for="f-tags">標籤 <span class="optional">選填</span></label>
              <input id="f-tags" name="tags" type="text" autocomplete="off" placeholder="以逗號分隔" aria-describedby="f-tags-hint">
            </div>
          </div>
          <p id="f-tags-hint" class="visually-hidden">多個標籤請用逗號或空白分隔</p>

          <button class="btn btn--primary btn--block" type="submit">加入收藏</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="cat-title">
        <div class="panel__head">
          <h2 id="cat-title" class="panel__title">分類</h2>
          <button type="button" class="btn btn--ghost btn--sm" data-manage-cats>管理分類</button>
        </div>
        <nav aria-label="依分類篩選">
          <ul class="cat-list" data-cat-list></ul>
        </nav>
      </section>
    </aside>

    <!-- 右欄：清單 -->
    <main class="content" id="list" tabindex="-1">
      <div class="toolbar">
        <div class="search">
          <label for="q" class="visually-hidden">搜尋收藏</label>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="搜尋筆記、作者、標籤…" autocomplete="off">
        </div>
        <label class="visually-hidden" for="sort">排序方式</label>
        <select id="sort" class="sort">
          <option value="new">最新加入</option>
          <option value="old">最早加入</option>
          <option value="author">依作者</option>
        </select>
      </div>

      <div class="active-filters" data-active-filters hidden></div>

      <p class="result-count" data-result-count aria-live="polite"></p>
      <ul class="cards" data-cards></ul>

      <div class="empty" data-empty hidden>
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="12" y="10" width="40" height="46" rx="8"/><path d="M22 24h20M22 32h20M22 40h12"/></svg>
        <p class="empty__title" data-empty-title></p>
        <p class="empty__text" data-empty-text></p>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <p class="footnote">資料只存在這台裝置的這個瀏覽器裡。換手機、換瀏覽器或清除網站資料前，記得先用右上角的「備份」匯出。</p>
  </footer>

  <!-- 編輯對話框 -->
  <dialog class="dialog" data-edit-dialog aria-labelledby="edit-title">
    <form method="dialog" class="dialog__body" data-edit-form>
      <h2 id="edit-title" class="dialog__title">編輯收藏</h2>
      <p class="dialog__url" data-edit-url></p>
      <div class="field">
        <label for="e-note">筆記</label>
        <textarea id="e-note" name="note" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="e-cat">分類</label>
        <select id="e-cat" name="category"></select>
      </div>
      <div class="field">
        <label for="e-tags">標籤</label>
        <input id="e-tags" name="tags" type="text" autocomplete="off" placeholder="以逗號分隔">
      </div>
      <div class="dialog__actions">
        <button type="button" class="btn btn--ghost" value="cancel" data-close>取消</button>
        <button type="submit" class="btn btn--primary" value="save">儲存變更</button>
      </div>
    </form>
  </dialog>

  <!-- 分類管理對話框 -->
  <dialog class="dialog" data-cat-dialog aria-labelledby="catm-title">
    <div class="dialog__body">
      <h2 id="catm-title" class="dialog__title">管理分類</h2>
      <form class="input-row" data-new-cat-form>
        <label for="new-cat" class="visually-hidden">新分類名稱</label>
        <input id="new-cat" type="text" maxlength="20" placeholder="新分類名稱" autocomplete="off" required>
        <button class="btn btn--primary" type="submit">新增分類</button>
      </form>
      <p class="field__msg" data-cat-msg role="status"></p>
      <ul class="cat-manage" data-cat-manage></ul>
      <p class="hint">刪除分類時，裡面的收藏會移到「未分類」，不會被刪掉。</p>
      <div class="dialog__actions">
        <button type="button" class="btn btn--primary" data-close>完成</button>
      </div>
    </div>
  </dialog>

  <div class="toast" data-toast role="status" aria-live="polite" hidden>
    <span data-toast-text></span>
    <button type="button" class="toast__action" data-toast-action hidden>復原</button>
  </div>

  <!-- 品牌圖示 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mark" viewBox="0 0 32 32">
      <rect x="4" y="3" width="24" height="26" rx="7" fill="var(--accent)"/>
      <path d="M11 3v13l5-3.4 5 3.4V3" fill="var(--accent-ink)" opacity=".9"/>
      <path d="M11 22h10" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
  </svg>
</body>
</html>
