<!DOCTYPE html>
<!-- 此頁不套用全站設計風格：片頭重製的試作頁，獨立的樣式與程式，不影響正式首頁 -->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>片頭試作 01：水冠與暈光｜Shopping Relics</title>
  <meta name="description" content="首頁片頭重製的第一步試作：用 WebGL 畫出發光的液體水冠與暈光。">
  <meta property="og:title" content="片頭試作 01：水冠與暈光">
  <meta property="og:description" content="首頁片頭重製的第一步試作。">
  <meta property="og:type" content="website">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #000; color: #f4ead2; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .hud { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
    .hud h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .06em; }
    .hud p { margin: 2px 0 0; font-size: 12.5px; line-height: 1.5; color: #d7c9a6; font-variant-numeric: tabular-nums; }
    .bar { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 0 12px; }
    button { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255, 220, 150, .4); background: rgba(20, 16, 8, .72); color: #fff4dc; font: 700 14px/1 inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #f1c35a; color: #2a1a04; border-color: transparent; }
    button:focus-visible { outline: 3px solid #ffd77a; outline-offset: 3px; }
    .msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; line-height: 1.7; }
    .msg[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>
  <div class="hud">
    <div>
      <h1>片頭試作 01：水冠與暈光</h1>
      <p id="info">啟動中…</p>
    </div>
    <p id="fps" aria-live="off">— fps</p>
  </div>
  <div class="bar" role="group" aria-label="播放控制">
    <button type="button" id="btn-replay">重播</button>
    <button type="button" id="btn-slow" aria-pressed="false">慢動作</button>
    <button type="button" id="btn-pause" aria-pressed="false">暫停</button>
    <button type="button" id="btn-bloom" aria-pressed="true">暈光</button>
  </div>
  <p class="msg" id="msg" hidden>這台裝置的瀏覽器無法使用 WebGL，試作畫面無法顯示。<br>正式版會在這種情況下自動改用現有的片頭。</p>
  <script defer src="intro-gl.js"></script>
  <script defer src="intro-crown.js"></script>
</body>
</html>
